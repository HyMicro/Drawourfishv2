name = "draw-our-fish"
main = "worker/index.ts"
compatibility_date = "2026-11-18"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "REEF"
class_name = "ReefRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReefRoom"]

[observability]
enabled = true

[vars]
# Optional comma-separated extra browser origins for /ws (when the frontend
# is hosted on a different domain). Same-origin is always allowed.
ALLOWED_ORIGINS = "https://drawourfish.pages.dev"
